<!-- ========================= -->

<script>

    // =========================================
    // LIMPIAR NOMBRE DE CAPA
    // =========================================

    function limpiarNombreCapa(nombre) {

        var temp = document.createElement("div");

        temp.innerHTML = nombre;

        var texto = temp.textContent || temp.innerText || "";

        texto = texto
            .replace(/\s+/g, ' ')
            .trim();

        return texto;
    }

    // =========================================
    // IDENTIFICAR MAPAS BASE
    // =========================================

    function esMapaBase(nombre) {

        nombre = nombre.toLowerCase();

        return (
            nombre.includes("openstreetmap") ||
            nombre.includes("esri topo") ||
            nombre.includes("google satellite")
        );
    }

    // =========================================
    // CARGAR FECHAS EN SELECTOR
    // =========================================

    function cargarFechas() {

        var selector = document.getElementById("selectorFecha");

        selector.innerHTML = "";

        function recorrerCapas(layer) {

            if (layer.getLayers) {

                layer.getLayers().forEach(recorrerCapas);

            } else {

                var nombre = layer.get('title');

                if (!nombre) return;

                nombre = limpiarNombreCapa(nombre);

                if (esMapaBase(nombre)) return;

                var option = document.createElement("option");

                option.value = nombre;

                option.text = nombre;

                selector.appendChild(option);
            }
        }

        map.getLayers().forEach(recorrerCapas);
    }

    // =========================================
    // FILTRAR CAPAS
    // =========================================

    function filtrarPorFecha() {

        var seleccion = document.getElementById("selectorFecha").value;

        function recorrerCapas(layer) {

            if (layer.getLayers) {

                layer.getLayers().forEach(recorrerCapas);

            } else {

                var nombre = layer.get('title');

                if (!nombre) return;

                nombre = limpiarNombreCapa(nombre);

                // mantener mapas base
                if (esMapaBase(nombre)) return;

                layer.setVisible(nombre === seleccion);
            }
        }

        map.getLayers().forEach(recorrerCapas);
    }

    // =========================================
    // DESCARGAR CAPA FILTRADA
    // =========================================

    function descargarPorFecha() {

        var seleccion = document.getElementById("selectorFecha").value;

        var formatoGeoJSON = new ol.format.GeoJSON();

        var extent = map.getView().calculateExtent(map.getSize());

        function recorrerCapas(layer) {

            if (layer.getLayers) {

                layer.getLayers().forEach(recorrerCapas);

            } else {

                var nombre = layer.get('title');

                if (!nombre) return;

                nombre = limpiarNombreCapa(nombre);

                if (nombre !== seleccion) return;

                var source = layer.getSource();

                if (!source || !source.getFeaturesInExtent) return;

                var features = source.getFeaturesInExtent(extent);

                if (features.length === 0) {

                    alert("No hay datos en el área visible");

                    return;
                }

                var geojson = formatoGeoJSON.writeFeatures(features, {

                    featureProjection: 'EPSG:3857',

                    dataProjection: 'EPSG:4326'

                });

                var nombreArchivo = nombre.replace(/[<>:"/\\|?*]+/g, '');

                var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(geojson);

                var link = document.createElement('a');

                link.setAttribute("href", dataStr);

                link.setAttribute("download", nombreArchivo + ".geojson");

                document.body.appendChild(link);

                link.click();

                link.remove();
            }
        }

        map.getLayers().forEach(recorrerCapas);
    }

    // =========================================
    // INICIALIZAR
    // =========================================

    window.addEventListener('load', function () {

        cargarFechas();

    });

</script>
